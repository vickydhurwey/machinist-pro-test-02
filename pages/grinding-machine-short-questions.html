
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grinding Machine Short Questions | MACHINIST PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08111f;color:#f1f5f9;font-family:Arial,sans-serif;padding:18px}
.container{max-width:800px;margin:auto}
header{text-align:center;padding:22px 10px}
header h1{color:#64e6a5;font-size:25px}
header p{color:#aab7c8;margin-top:10px;line-height:1.6}
.info{background:#111e30;border:1px solid #263a50;border-radius:12px;padding:15px;margin:15px 0 22px;color:#cbd5e1;line-height:1.8}
.question{background:#111e30;border:1px solid #263a50;border-radius:12px;padding:17px;margin-bottom:14px}
.number{color:#64e6a5;font-size:12px;font-weight:bold;margin-bottom:9px}
.question h3{font-size:16px;line-height:1.6;margin-bottom:12px}
.answer{display:none;background:#172c2b;border-left:3px solid #64e6a5;padding:13px;border-radius:7px;color:#d9f7e8;line-height:1.8;font-size:14px;margin-top:12px}
button{background:#64e6a5;color:#08111f;border:none;padding:10px 15px;border-radius:7px;font-weight:bold;cursor:pointer}
footer{text-align:center;color:#8090a5;margin:30px 0 15px;font-size:13px}
.back{display:inline-block;color:#64e6a5;text-decoration:none;margin-top:15px}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🛠️ Grinding Machine</h1>
<p>MACHINIST PRO – ITI Machinist 1st Year</p>
<p>महत्वपूर्ण लघु उत्तरीय प्रश्न एवं उत्तर</p>
</header>

<div class="info">
<b>कुल प्रश्न:</b> 20<br>
<b>विषय:</b> Grinding Machine<br>
<b>निर्देश:</b> प्रश्न पढ़ें और Show Answer पर क्लिक करके उत्तर देखें।
</div>

<div id="questions"></div>

<footer>
<p>© 2026 MACHINIST PRO</p>
<p>Learn • Practice • Improve</p>
<a class="back" href="notes.html">← Back to Notes</a>
</footer>

</div>

<script>
const data=[
["Grinding Machine क्या है?","ग्राइंडिंग मशीन एक मशीन टूल है, जिसका उपयोग अपघर्षक व्हील की सहायता से वर्कपीस की सतह से थोड़ी मात्रा में पदार्थ हटाने के लिए किया जाता है।"],
["Grinding का क्या अर्थ है?","ग्राइंडिंग एक मशीनिंग प्रक्रिया है, जिसमें घूमते हुए Abrasive Wheel द्वारा पदार्थ हटाकर सतह को सही आकार और फिनिश दी जाती है।"],
["Grinding Machine का मुख्य कार्य क्या है?","इसका मुख्य कार्य सतह को चिकना करना, सही आकार देना, किनारों को तेज करना और सटीक माप प्राप्त करना है।"],
["Grinding Wheel क्या है?","Grinding Wheel एक घूमने वाला अपघर्षक उपकरण है, जिसमें Abrasive Grains और उन्हें बाँधने वाला Bond होता है।"],
["Grinding Wheel के मुख्य घटक कौन-कौन से हैं?","मुख्य घटक हैं – Abrasive, Bond और Pores यानी कणों के बीच खाली स्थान।"],
["Abrasive क्या होता है?","Abrasive कठोर कण होते हैं, जो घिसकर वर्कपीस की सतह से पदार्थ हटाते हैं। उदाहरण – Aluminium Oxide और Silicon Carbide।"],
["Bond का क्या कार्य है?","Bond ग्राइंडिंग व्हील के अपघर्षक कणों को आपस में बाँधकर रखता है।"],
["Grinding Machine के प्रमुख प्रकार कौन-कौन से हैं?","प्रमुख प्रकार हैं – Bench Grinder, Pedestal Grinder, Surface Grinder, Cylindrical Grinder और Tool and Cutter Grinder।"],
["Bench Grinder क्या है?","Bench Grinder एक छोटी ग्राइंडिंग मशीन है, जिसे बेंच पर लगाया जाता है। इसका उपयोग छोटे औजारों को तेज करने और हल्की ग्राइंडिंग के लिए होता है।"],
["Pedestal Grinder क्या है?","Pedestal Grinder को एक मजबूत स्टैंड पर लगाया जाता है। इसका उपयोग औजारों को तेज करने और सामान्य ग्राइंडिंग कार्यों में होता है।"],
["Surface Grinding Machine क्या है?","Surface Grinding Machine का उपयोग वर्कपीस की समतल सतह को सटीक और चिकना बनाने के लिए किया जाता है।"],
["Cylindrical Grinding क्या है?","इस प्रक्रिया में बेलनाकार वर्कपीस की बाहरी या अंदरूनी सतह को ग्राइंड किया जाता है।"],
["Tool and Cutter Grinder का उपयोग क्या है?","इसका उपयोग कटिंग टूल जैसे मिलिंग कटर, रीमर और अन्य औजारों को तेज करने तथा उनकी धार सुधारने के लिए किया जाता है।"],
["Dressing क्या है?","Dressing में ग्राइंडिंग व्हील की सतह से घिसे हुए कण और जमा पदार्थ हटाकर नए तेज कण सामने लाए जाते हैं।"],
["Truing क्या है?","Truing में ग्राइंडिंग व्हील को सही गोल आकार और घूमने की ज्यामितीय शुद्धता में लाया जाता है।"],
["Grinding Wheel में Grit Size क्या बताता है?","Grit Size अपघर्षक कणों के आकार को बताता है। सामान्यतः छोटी grit संख्या बड़े कण और बड़ी grit संख्या छोटे कण दर्शाती है।"],
["Grinding Wheel की Grade क्या बताती है?","Grade यह बताती है कि Bond अपघर्षक कणों को कितनी मजबूती से पकड़े हुए है।"],
["Grinding में Coolant का क्या उपयोग है?","Coolant गर्मी कम करने, सतह की गुणवत्ता सुधारने और ग्राइंडिंग क्षेत्र से कण हटाने में मदद करता है।"],
["Grinding Machine में Wheel Balancing क्यों जरूरी है?","Wheel Balancing से असंतुलन के कारण होने वाला कंपन कम होता है और मशीन का संचालन बेहतर रहता है।"],
["Grinding Machine पर काम करते समय कौन-सी सावधानियाँ रखनी चाहिए?","सुरक्षा चश्मा और आवश्यक PPE पहनें, व्हील में दरार की जाँच योग्य व्यक्ति से करवाएँ, सही सुरक्षा गार्ड रखें और मशीन की निर्धारित सुरक्षित गति का पालन करें।"]
];

const container=document.getElementById("questions");

data.forEach((item,index)=>{
  const card=document.createElement("div");
  card.className="question";

  const number=document.createElement("div");
  number.className="number";
  number.textContent="QUESTION "+String(index+1).padStart(2,"0");

  const heading=document.createElement("h3");
  heading.textContent=(index+1)+". "+item[0];

  const button=document.createElement("button");
  button.textContent="Show Answer";

  const answer=document.createElement("div");
  answer.className="answer";
  answer.textContent="उत्तर: "+item[1];

  button.addEventListener("click",()=>{
    const visible=answer.style.display==="block";
    answer.style.display=visible?"none":"block";
    button.textContent=visible?"Show Answer":"Hide Answer";
  });

  card.append(number,heading,button,answer);
  container.appendChild(card);
});
</script>

</body>
</html>
