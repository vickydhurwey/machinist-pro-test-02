["फेसिंग ऑपरेशन का उद्देश्य क्या है?",["बाहरी चूड़ी बनाना","सिरे की सतह समतल करना","छेद बनाना","खांचा बनाना"],1],
["टर्निंग ऑपरेशन में क्या किया जाता है?",["बाहरी व्यास कम किया जाता है","छेद बंद किया जाता है","धातु जोड़ी जाती है","रंग किया जाता है"],0],
["पार्टिंग ऑपरेशन का उपयोग किसलिए होता है?",["वर्कपीस को अलग करने के लिए","छेद बनाने के लिए","चूड़ी बनाने के लिए","सतह पॉलिश करने के लिए"],0],

["ग्रूविंग ऑपरेशन में क्या बनाया जाता है?",["खांचा","चूड़ी","बड़ा छेद","समतल सतह"],0],

["टेलस्टॉक में कौन-सा टूल लगाया जा सकता है?",["ड्रिल","हैंड फाइल","हथौड़ा","स्पैनर"],0],
["लेथ मशीन में फीड का क्या अर्थ है?",["टूल का आगे बढ़ना","स्पिंडल का रुकना","वर्कपीस का गर्म होना","मशीन का वजन"],0],
["स्पिंडल स्पीड की इकाई क्या है?",["RPM","mm","kg","Newton"],0],
["RPM का पूरा नाम क्या है?",["Rotation Per Minute","Round Per Meter","Rotation Per Machine","Rate Per Millimeter"],0],
["लेथ मशीन में चक का मुख्य कार्य क्या है?",["वर्कपीस को पकड़ना","टूल तेज करना","मशीन ठंडी करना","माप लेना"],0],
["फोर जॉ चक में कितने जॉ होते हैं?",["2","3","4","6"],2],
["थ्री जॉ चक में कितने जॉ होते हैं?",["2","3","4","5"],1],
["स्वतंत्र रूप से समायोजित होने वाले जॉ किस चक में होते हैं?",["थ्री जॉ चक","फोर जॉ स्वतंत्र चक","कोलेट चक","मैग्नेटिक चक"],1],
["कौन-सा टूल बाहरी टर्निंग के लिए उपयोग होता है?",["Turning Tool","Drill","Reamer","Tap"],0],
["लेथ मशीन में कटिंग फ्लुइड का उपयोग क्यों किया जाता है?",["ठंडा करने और घर्षण कम करने में सहायता के लिए","मशीन का रंग बदलने के लिए","स्पीड बढ़ाने के लिए ही","वर्कपीस पकड़ने के लिए"],0],
["लेथ मशीन में लीड स्क्रू का उपयोग मुख्यतः किसमें होता है?",["थ्रेड कटिंग","फेसिंग","नर्लिंग","सामान्य माप"],0],
["कंपाउंड रेस्ट का उपयोग किसलिए किया जाता है?",["कोण पर टूल फीड देने के लिए","मशीन रोकने के लिए","वर्कपीस गर्म करने के लिए","बेल्ट कसने के लिए"],0],
["लेथ मशीन में एप्रन किसका भाग है?",["कैरिज","हेडस्टॉक","टेलस्टॉक","बेड"],0],
["लेथ मशीन में कौन-सा ऑपरेशन शंक्वाकार सतह बनाने में उपयोगी है?",["Taper Turning","Facing","Parting","Knurling"],0],
["टूल की धार तेज करने के लिए क्या उपयोग किया जाता है?",["ग्राइंडिंग मशीन","ड्रिल मशीन","लेथ चक","माइक्रोमीटर"],0],
["वर्कपीस की लंबाई मापने के लिए सामान्यतः क्या उपयोग होता है?",["स्टील रूल","चक","डाई","टैप"],0],
["लेथ मशीन में मशीनिंग के दौरान चिप्स किससे बनते हैं?",["कटिंग प्रक्रिया से हटाए गए पदार्थ से","कूलेंट से","बिजली से","मशीन के बेड से"],0],
["लेथ मशीन पर काम करते समय ढीले कपड़े क्यों नहीं पहनने चाहिए?",["वे घूमते भागों में फंस सकते हैं","वे गर्मी बढ़ाते हैं","वे माप खराब करते हैं","वे मशीन की स्पीड घटाते हैं"],0],
["मशीन की सफाई कब करनी चाहिए?",["मशीन सुरक्षित रूप से बंद होने के बाद","मशीन चलते समय","वर्कपीस घूमते समय","कटिंग के बीच हाथ से"],0],
["लेथ मशीन में बेड का मुख्य कार्य क्या है?",["मुख्य भागों को सहारा और मार्गदर्शन देना","वर्कपीस को घुमाना","कटिंग फ्लुइड बनाना","चूड़ी बनाना"],0],
["लेथ मशीन में टेपर टर्निंग का अर्थ क्या है?",["शंक्वाकार सतह बनाना","सीधी सतह बनाना","छेद बंद करना","नर्लिंग करना"],0],
["लेथ मशीन का उपयोग किस उद्योग में होता है?",["मशीन निर्माण उद्योग","केवल कपड़ा उद्योग","केवल खाद्य उद्योग","केवल कागज उद्योग"],0]
];

const quiz = document.getElementById("quiz");

questions.forEach((q,i)=>{
  const box=document.createElement("section");
  box.className="question";

  const title=document.createElement("h3");
  title.textContent=(i+1)+". "+q[0];
  box.appendChild(title);

  q[1].forEach((option,j)=>{
    const label=document.createElement("div");
    label.className="option";
    label.textContent=String.fromCharCode(65+j)+". "+option;
    box.appendChild(label);
  });

  const btn=document.createElement("button");
  btn.textContent="Show Answer";

  const answer=document.createElement("div");
  answer.className="answer";
  answer.textContent="सही उत्तर: "+String.fromCharCode(65+q[2])+". "+q[1][q[2]];

  btn.addEventListener("click",()=>{
    const visible=answer.style.display==="block";
    answer.style.display=visible?"none":"block";
    btn.textContent=visible?"Show Answer":"Hide Answer";
  });

  box.appendChild(btn);
  box.appendChild(answer);
  quiz.appendChild(box);
});
</script>

</body>
</html>
