
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Calculation Question Bank | MACHINIST PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#eaf2ff;font-family:Arial,sans-serif;line-height:1.7}
header{background:#101d30;padding:22px 16px;border-bottom:1px solid #263750}
header a{color:#64e6a5;text-decoration:none}
header h1{font-size:23px;margin:12px 0 4px}
header p{color:#aab8ca;font-size:14px}
.container{max-width:850px;margin:auto;padding:16px}
.question{background:#111f32;border:1px solid #263750;border-radius:12px;padding:16px;margin:14px 0}
.question h3{font-size:16px;margin:0 0 12px}
.option{display:block;background:#0b1727;border:1px solid #34465e;padding:9px 11px;border-radius:8px;margin:7px 0;color:#d0dbea;font-size:14px}
.answer{display:none;background:#142b2b;border-left:4px solid #64e6a5;padding:10px;margin-top:10px;border-radius:7px;color:#b7f5d5}
button{background:#64e6a5;color:#08111f;border:0;border-radius:7px;padding:9px 13px;font-weight:bold;margin-top:10px}
footer{text-align:center;color:#8191a8;padding:25px}
</style>
</head>
<body>

<header>
<a href="notes.html">← वापस Notes पर जाएं</a>
<h1>📘 Workshop Calculation – Question Bank</h1>
<p>Machinist First Year | 40 महत्वपूर्ण MCQ</p>
</header>

<main class="container" id="quiz"></main>
<footer>MACHINIST PRO | Practice Questions</footer>

<script>
const questions = [
["संख्या पद्धति में प्राकृतिक संख्याएँ किससे शुरू होती हैं?",["0","1","-1","10"],1],
["सबसे छोटी पूर्ण संख्या कौन-सी है?",["0","1","-1","2"],0],
["सम संख्या किससे पूरी तरह विभाजित होती है?",["2","3","5","7"],0],
["विषम संख्या का उदाहरण कौन-सा है?",["12","18","21","40"],2],
["12 और 18 का HCF कितना है?",["3","6","9","12"],1],
["4 और 6 का LCM कितना है?",["6","8","12","24"],2],
["1 मीटर में कितने मिलीमीटर होते हैं?",["100","1000","10","10000"],1],
["1 सेंटीमीटर में कितने मिलीमीटर होते हैं?",["10","100","1000","1"],0],
["1 किलोमीटर में कितने मीटर होते हैं?",["100","500","1000","10000"],2],
["1 किलोग्राम में कितने ग्राम होते हैं?",["10","100","1000","10000"],2],
["भिन्न 1/2 का दशमलव रूप क्या है?",["0.25","0.5","0.75","1.5"],1],
["0.25 को भिन्न में लिखने पर क्या मिलेगा?",["1/2","1/3","1/4","3/4"],2],
["25% का भिन्न रूप क्या है?",["1/2","1/4","3/4","1/5"],1],
["200 का 10% कितना होगा?",["10","20","30","40"],1],
["किसी संख्या का 50% किसके बराबर होता है?",["आधा","दोगुना","तीन गुना","चौथाई"],0],
["अनुपात 2:4 को सरल करने पर क्या होगा?",["1:2","2:1","1:4","4:1"],0],
["10, 20 और 30 का औसत कितना है?",["10","15","20","30"],2],
["वर्ग का क्षेत्रफल निकालने का सूत्र क्या है?",["भुजा × भुजा","लंबाई × चौड़ाई","2 × भुजा","लंबाई + चौड़ाई"],0],
["आयत का क्षेत्रफल क्या होता है?",["लंबाई × चौड़ाई","2 × लंबाई","लंबाई + चौड़ाई","भुजा × भुजा"],0],
["त्रिभुज का क्षेत्रफल क्या होता है?",["आधार × ऊँचाई","1/2 × आधार × ऊँचाई","2 × आधार","आधार + ऊँचाई"],1],
["वृत्त का क्षेत्रफल निकालने का सूत्र क्या है?",["πr²","2πr","πd","r²/2"],0],
["वृत्त की परिधि का सूत्र क्या है?",["πr²","2πr","r × r","πr³"],1],
["घन का आयतन निकालने का सूत्र क्या है?",["भुजा³","लंबाई × चौड़ाई","πr²","2 × भुजा"],0],
["घनाभ का आयतन क्या होता है?",["लंबाई × चौड़ाई × ऊँचाई","लंबाई + चौड़ाई","2 × लंबाई","भुजा³"],0],
["बेलन का आयतन क्या होता है?",["πr²h","2πr","πr²","l × b"],0],
["वेग का सूत्र क्या है?",["दूरी / समय","समय / दूरी","दूरी × समय","दूरी + समय"],0],
["यदि दूरी 100 मीटर और समय 20 सेकंड हो तो वेग कितना होगा?",["2 m/s","5 m/s","10 m/s","20 m/s"],1],
["बल की SI इकाई क्या है?",["जूल","न्यूटन","वाट","पास्कल"],1],
["कार्य की SI इकाई क्या है?",["न्यूटन","जूल","वाट","मीटर"],1],
["शक्ति की SI इकाई क्या है?",["वाट","जूल","न्यूटन","पास्कल"],0],
["दाब की SI इकाई क्या है?",["जूल","न्यूटन","पास्कल","वाट"],2],
["घनत्व का सूत्र क्या है?",["द्रव्यमान / आयतन","आयतन / द्रव्यमान","बल / क्षेत्रफल","दूरी / समय"],0],
["तापमान की SI इकाई क्या है?",["सेल्सियस","फारेनहाइट","केल्विन","जूल"],2],
["1 घंटे में कितने मिनट होते हैं?",["30","45","60","100"],2],
["1 मिनट में कितने सेकंड होते हैं?",["30","60","100","120"],1],
["सरल मशीन का उदाहरण कौन-सा है?",["लीवर","थर्मामीटर","माइक्रोमीटर","वोल्टमीटर"],0],
["यांत्रिक लाभ का सूत्र क्या है?",["भार / प्रयास","प्रयास / भार","कार्य / समय","दूरी / समय"],0],
["पाई (π) का लगभग मान क्या है?",["2.14","3.14","4.14","5.14"],1],
["यदि किसी वस्तु का द्रव्यमान 10 kg और आयतन 2 m³ है तो घनत्व कितना होगा?",["2 kg/m³","5 kg/m³","10 kg/m³","20 kg/m³"],1],
["यदि 5 वस्तुओं की कीमत ₹100 है तो 1 वस्तु की कीमत कितनी होगी?",["₹10","₹15","₹20","₹25"],2]
];

const quiz=document.getElementById("quiz");

questions.forEach((q,i)=>{
 const box=document.createElement("section");
 box.className="question";

 const title=document.createElement("h3");
 title.textContent=(i+1)+". "+q[0];
 box.appendChild(title);

 q[1].forEach((option,j)=>{
  const div=document.createElement("div");
  div.className="option";
  div.textContent=String.fromCharCode(65+j)+". "+option;
  box.appendChild(div);
 });

 const btn=document.createElement("button");
 btn.textContent="Show Answer";

 const answer=document.createElement("div");
 answer.className="answer";
 answer.textContent="सही उत्तर: "+String.fromCharCode(65+q[2])+". "+q[1][q[2]];

 btn.addEventListener("click",()=>{
  const visible=answer.style.display==="block";
  answer.style.display=visible?"none":"block";
  btn.textContent=visible?"Show Answer":"Hide Answer";
 });

 box.appendChild(btn);
 box.appendChild(answer);
 quiz.appendChild(box);
});
</script>

</body>
</html>
